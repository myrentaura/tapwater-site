<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" sizes="96x96">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,700;9..40,800;9..40,900&family=Figtree:wght@400;600;700&display=swap"><link rel="stylesheet" href="site.css">
<script>try{var c=localStorage.getItem('tapwater.cw');if(c)document.documentElement.dataset.cw=c}catch(e){}</script>
<title>tapwater admin</title>
<style>
.admin{max-width:720px;margin:32px auto;background:var(--surface);border-radius:32px;padding:32px}
.admin form{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.admin input{flex:1;min-width:180px;font:inherit;padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:inherit}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:20px}
.stat{border:1px solid var(--line);border-radius:20px;padding:18px}
.stat b{display:block;font-family:'DM Sans',sans-serif;font-weight:900;font-size:34px;color:var(--ink)}
.stat span{color:var(--muted);font-size:14px}
.stat.big{grid-column:1/-1}.stat.big b{font-size:56px}
</style>
</head><body>
<main class="wrap"><div class="admin">
  <h1>tapwater™ numbers</h1>
  <p class="small">Private. Only works with your admin passcode.</p>
  <form id="f"><input id="pass" type="password" placeholder="Admin passcode" autocomplete="current-password" required><button class="btn" type="submit">Show numbers</button></form>
  <p class="small" id="msg"></p>
  <div class="stats" id="stats" hidden></div>
</div></main>
<script>
(function () {
  var URL = 'https://fdnypkbjbdewlkaunhqr.supabase.co/rest/v1/rpc/admin_impact';
  var KEY = 'sb_publishable_udNLCAk5cmVM-Purm5J4oQ_nd8we8I5';
  var LABELS = [
    ['bottles', 'plastic bottles skipped by everyone', true],
    ['phones', 'phones counting bottles'],
    ['active_7d', 'phones active in the last 7 days'],
    ['active_30d', 'phones active in the last 30 days'],
    ['new_7d', 'new phones this week'],
    ['friend_profiles', 'people using Friends'],
    ['sharing_progress', 'sharing their daily progress']
  ];
  var form = document.getElementById('f'), msg = document.getElementById('msg'), box = document.getElementById('stats');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    msg.textContent = 'Loading…';
    fetch(URL, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_pass: document.getElementById('pass').value }) })
      .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
      .then(function (d) {
        box.innerHTML = '';
        LABELS.forEach(function (l) {
          var div = document.createElement('div');
          div.className = 'stat' + (l[2] ? ' big' : '');
          var b = document.createElement('b'); b.textContent = Number(d[l[0]] || 0).toLocaleString();
          var s = document.createElement('span'); s.textContent = l[1];
          div.appendChild(b); div.appendChild(s); box.appendChild(div);
        });
        box.hidden = false;
        msg.textContent = 'Updated ' + new Date().toLocaleString() + '. Bottles are estimates: every 16.9 oz logged counts as one.';
      })
      .catch(function () { box.hidden = true; msg.textContent = "That passcode didn't work, or the database isn't set up yet."; });
  });
})();
</script>
</body></html>
